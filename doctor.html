<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart Doctor</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
    --accent: #3b6fd8; --accent-text: #ffffff; --keep: #2f8a4c; --warn: #c2571a; --danger: #b8322a;
    --track: #ecebe6; --warn-bg: #fbefe6; --dot: 29, 29, 27; --lane: #f1f0ec; --lane2: #e9e8e3;
    --grid: #d6d5cf; --beat: #c3c2bb; --bar: #9e9d96;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #20201e; --text: #ecebe6; --muted: #9b9a93; --line: #34332f;
      --accent: #6d97ee; --accent-text: #0f0f0e; --keep: #5bbf7a; --warn: #ec8b52; --danger: #ef6b62;
      --track: #2b2a27; --warn-bg: #3a2a1f; --dot: 236, 235, 230; --lane: #1b1b1a; --lane2: #242422;
      --grid: #2c2c2a; --beat: #3d3d3a; --bar: #66655f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  nav { border-right: 1px solid var(--line); padding: 16px; background: var(--panel); height: 100vh; position: sticky; top: 0;
    display: flex; flex-direction: column; min-height: 0; }
  nav h1 { font-size: 15px; margin: 0 0 2px; }
  nav .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  nav .sub a { color: var(--accent); }
  .songs { flex: 1; overflow-y: auto; min-height: 0; }
  .songs button { display: block; width: 100%; text-align: left; padding: 6px 9px; margin: 1px 0; border: 1px solid transparent;
    border-radius: 6px; background: none; color: var(--text); font: inherit; cursor: pointer; }
  .songs button:hover { border-color: var(--line); }
  .songs button.active { background: var(--accent); color: var(--accent-text); }
  .songs small { display: block; opacity: .75; font-size: 12px; }
  .settings { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; flex: none; }
  .settings h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .settings.ask { border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 10px; }
  main { padding: 20px 24px; min-width: 0; }
  h2 { margin: 0 0 2px; font-size: 20px; }
  h3 { margin: 0 0 8px; font-size: 14px; }
  .meta { color: var(--muted); margin-bottom: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .flags { background: var(--warn-bg); border-color: var(--warn); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font: inherit; cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary, .btn.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .small { padding: 3px 8px; font-size: 12px; }
  .hint, .note { color: var(--muted); font-size: 12px; }
  .err { color: var(--danger); }
  input[type=text] { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); width: 100%; }
  select { font: inherit; font-size: 12px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 90px; }
  canvas { display: block; width: 100%; }
  #overview { height: 38px; cursor: pointer; border-radius: 4px; margin-bottom: 6px; }
  #timeline { height: 370px; cursor: crosshair; user-select: none; }
  #template { height: 160px; cursor: pointer; }
  .grid2 { display: grid; grid-template-columns: minmax(240px, 1fr) 2fr; gap: 12px; align-items: start; }
  @media (max-width: 1000px) { .app { grid-template-columns: 1fr; } nav { position: static; height: auto; max-height: 50vh; } .grid2 { grid-template-columns: 1fr; } }
  .riffs button { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; padding: 6px 8px; margin: 2px 0;
    border: 1px solid var(--line); border-radius: 6px; background: none; color: var(--text); font: inherit; cursor: pointer; }
  .riffs button.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .riffs .grow { flex: 1; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
  .tag.warn { color: var(--warn); } .tag.ok { color: var(--keep); } .tag.edit { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; }
  .map { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; margin: 10px 0; }
  .frets { display: inline-flex; gap: 4px; }
  .fret { width: 30px; height: 26px; border-radius: 13px; border: 2px solid var(--fc); background: none; cursor: pointer;
    color: var(--text); font: 600 12px system-ui; }
  .fret.on { background: var(--fc); color: #111; }
  .pname { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pname small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  label.opt { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  input[type=range] { width: 90px; }
  .progress { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .progress > div { height: 100%; background: var(--accent); width: 30%; animation: slide 1.2s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  .empty { color: var(--muted); padding: 40px 0; }
  ul.flaglist { margin: 4px 0 0; padding-left: 18px; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  details.keys summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details.keys ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 12px; columns: 2; }
</style>
</head>
<body>
<div class="app">
  <nav>
    <h1>Chart Doctor</h1>
    <div class="sub">Check and fix guitar and bass charts against their stems. <b>Experimental:</b> for adjusting charts you've played in game, not charting from scratch. <a href="/">Back to stem review</a></div>
    <div class="row" style="flex-wrap:nowrap; margin-bottom:6px">
      <input type="text" id="root" placeholder="Songs folder, e.g. D:\Games\YARG\Songs">
      <button class="btn small" id="list">List</button>
    </div>
    <input type="text" id="filter" placeholder="Filter songs" style="margin-bottom:8px">
    <div id="songs" class="songs"><div class="hint">Enter your songs folder and press List.</div></div>
    <div class="settings" id="settings"></div>
  </nav>
  <main id="main"><div class="empty">Pick a song on the left.</div></main>
</div>
<script>
const OPEN = 5;                                  // lane number of an open note
const ROWS = [OPEN, 0, 1, 2, 3, 4];             // lanes top to bottom: P G R Y B O
const COLOR = { 0: "#35b457", 1: "#e2463f", 2: "#e9c32b", 3: "#3d80e3", 4: "#f08b2d", 5: "#a35ee0" };
const NAME = { 0: "G", 1: "R", 2: "Y", 3: "B", 4: "O", 5: "P" };
const lanesText = lanes => lanes.map(l => NAME[l]).join("");
const NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
const RIFF_COLORS = ["#8a6fd8", "#2fa3a3", "#d86f9b", "#c2571a", "#5f8f2f", "#3b6fd8", "#b08a1e", "#9b4fc0"];
const DEFAULT_LANES = { 1: [0], 2: [0, 1], 3: [0, 1, 2], 4: [0, 1, 2, 3], 5: [0, 1, 2, 3, 4] };
const GRIDS = [4, 8, 12, 16, 24, 32, 48, 64];   // snap to 1/N notes
const VOICED = 0.5, LOUD = -38;  // a pitch frame counts when CREPE is this sure and it's this loud (dB below peak)

const $ = (s, el = document) => el.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
const pname = m => { const r = Math.round(m); return NAMES[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1); };
const median = a => { const s = [...a].sort((x, y) => x - y); return s.length ? s[s.length >> 1] : NaN; };
const pct = x => `${Math.round(x * 100)}%`;
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

async function getJSON(path) {
  const r = await fetch(path); const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
async function postTo(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Stem-Review": "1" },
                              body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
const post = (action, body) => postTo(`/api/doctor/${action}`, body);

// ------------------------------------------------------------------ state
let S = { songs: [], settings: null };   // everything about the open song lives here
let actx = null, buffers = {}, sources = [], gains = {}, playing = false, startedAt = 0, startPos = 0, loop = null, pos = 0;

// ------------------------------------------------------------------ settings (bottom of the nav)
async function loadSettings() {
  try { S.settings = (await getJSON("/api/settings")).settings; } catch { S.settings = { charter_name: "" }; }
  renderSettings();
}
function renderSettings(msg = "") {
  const el = $("#settings"), name = S.settings?.charter_name || "";
  el.className = `settings${name ? "" : " ask"}`;
  el.innerHTML = `<h4>Settings</h4>
    <label for="charter" style="font-size:12px">Your charter name</label>
    <div class="row" style="flex-wrap:nowrap; margin-top:4px"><input type="text" id="charter" value="${esc(name)}" placeholder="e.g. your alias">
      <button class="btn small" id="charter-save">Save</button></div>
    <div class="hint" style="margin-top:4px">${msg ? esc(msg) : name ? `Saving a chart adds <b>${esc(name)}</b> to its charter credit in song.ini.`
      : "Set this to be credited in song.ini when you save a chart (or chart vocals on the review page)."}</div>`;
  const saveName = async () => {
    try { S.settings = (await postTo("/api/settings", { charter_name: $("#charter").value })).settings; renderSettings("Saved."); if (S.chart) renderSave(); }
    catch (e) { renderSettings(e.message); }
  };
  $("#charter-save").onclick = saveName;
  $("#charter").onkeydown = e => { if (e.key === "Enter") saveName(); };
}

// ------------------------------------------------------------------ song list
async function listSongs() {
  const root = $("#root").value.trim();
  if (!root) return;
  $("#songs").innerHTML = `<div class="hint">Looking for songs…</div><div class="progress"><div></div></div>`;
  try {
    const r = await getJSON(`/api/doctor/songs?root=${encodeURIComponent(root)}`);
    store.set("doctor-root", root);
    S.songs = r.songs;
    renderSongs();
  } catch (e) { $("#songs").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function renderSongs() {
  const f = $("#filter").value.trim().toLowerCase();
  const list = S.songs.filter(s => !f || `${s.artist} ${s.name}`.toLowerCase().includes(f));
  $("#songs").innerHTML = list.length ? list.slice(0, 400).map(s => `
    <button data-path="${esc(s.path)}" class="${s.path === S.path ? "active" : ""}">${esc(s.name)}
      <small>${esc(s.artist)}${s.stems.length ? "" : " · no stems yet"}${s.edited ? " · edited" : ""}</small></button>`).join("")
    + (list.length > 400 ? `<div class="hint">${list.length - 400} more; filter to find them.</div>` : "")
    : `<div class="hint">${S.songs.length ? "No songs match." : "Enter your songs folder and press List."}</div>`;
}
$("#songs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) openSong(b.dataset.path); });
$("#list").onclick = listSongs;
$("#root").addEventListener("keydown", e => { if (e.key === "Enter") listSongs(); });
$("#filter").addEventListener("input", renderSongs);

// ------------------------------------------------------------------ timing
function buildTiming() {
  const { tpb, tempos, time_signatures: ts, end_tick } = S.chart;
  S.tempoSegs = []; let sec = 0;
  for (let i = 0; i < tempos.length; i++) {
    if (i) sec += (tempos[i][0] - tempos[i - 1][0]) / tpb * tempos[i - 1][1] / 1e6;
    S.tempoSegs.push([tempos[i][0], sec, tempos[i][1]]);
  }
  const bars = [], beatLen = []; let tick = 0, i = 0;
  while (tick <= end_tick + tpb * 8) {  // a couple of spare bars, for notes added after the last one
    while (i + 1 < ts.length && ts[i + 1][0] <= tick) i++;
    let len = tpb * 4 * ts[i][1] / ts[i][2];
    if (i + 1 < ts.length && ts[i + 1][0] < tick + len) len = ts[i + 1][0] - tick;
    bars.push(tick); beatLen.push(tpb * 4 / ts[i][2]); tick += len;
  }
  bars.push(tick);
  S.bars = bars; S.beatLen = beatLen; S.barSec = bars.map(secOf);
}
function secOf(tick) {
  const segs = S.tempoSegs; let lo = 0, hi = segs.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (segs[m][0] <= tick) lo = m; else hi = m - 1; }
  const [t, s, us] = segs[lo];
  return s + (tick - t) / S.chart.tpb * us / 1e6;
}
function tickAt(sec) {
  const segs = S.tempoSegs; let lo = 0, hi = segs.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (segs[m][1] <= sec) lo = m; else hi = m - 1; }
  const [t, s, us] = segs[lo];
  return t + (sec - s) * 1e6 / us * S.chart.tpb;
}
function barOf(tick) {
  let lo = 0, hi = S.bars.length - 2;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (S.bars[m] <= tick) lo = m; else hi = m - 1; }
  return lo;
}
// The snap grid: 1/N notes, picked from the zoom level unless chosen.
function gridDiv() {
  if (S.grid !== "auto") return +S.grid;
  const mid = tickAt(S.view.t0 + S.view.span / 2), tpb = S.chart.tpb;
  const pxPerBeat = (S.W || 1000) / S.view.span * (secOf(mid + tpb) - secOf(mid));
  let best = 4;
  for (const n of [4, 8, 16, 32, 64]) if (pxPerBeat * 4 / n >= 18) best = n;
  return best;
}
const gridStep = () => S.chart.tpb * 4 / gridDiv();
function snapTick(tick) {
  tick = Math.max(0, tick);
  if (!S.snap) return Math.round(tick);
  const b = barOf(tick), step = gridStep();
  return Math.round(S.bars[b] + Math.round((tick - S.bars[b]) / step) * step);
}

// ------------------------------------------------------------------ notes
const noteOf = raw => ({ tick: raw.tick, len: raw.len, lanes: [...raw.lanes], force: raw.force || null, tap: !!raw.tap,
                         lens: raw.lens || null, t: secOf(raw.tick) });
const clone = n => ({ ...n, lanes: [...n.lanes] });
function findIdx(tick, notes = S.notes) {
  let lo = 0, hi = notes.length - 1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (notes[m].tick === tick) return m; if (notes[m].tick < tick) lo = m + 1; else hi = m - 1; }
  return -1;
}
const noteAt = tick => { const i = findIdx(tick); return i >= 0 ? S.notes[i] : null; };
function insertNote(n) {
  let i = S.notes.findIndex(x => x.tick > n.tick); if (i < 0) i = S.notes.length;
  S.notes.splice(i, 0, n);
}
function removeAt(tick) { const i = findIdx(tick); if (i >= 0) S.notes.splice(i, 1); }
const noSustain = () => Math.round(S.chart.tpb / 8);
function changed(n) {
  const o = S.origByTick.get(n.tick);
  return !o || o.lanes.join() !== n.lanes.join() || o.len !== n.len || (o.force || null) !== (n.force || null);
}
function changeCounts() {
  let added = 0, edited = 0;
  for (const n of S.notes) { if (!S.origByTick.has(n.tick)) added++; else if (changed(n)) edited++; }
  const removed = S.orig.filter(o => findIdx(o.tick) < 0).length;
  return { added, edited, removed, total: added + edited + removed };
}
// Natural HOPO, as the games decide it for notes.mid: a single note soon after the one before,
// on a different fret. Forced markers and taps override it.
function hopoKind(i, notes = S.notes) {
  const n = notes[i];
  if (n.tap) return "tap";
  if (n.force === "H") return "hopo";
  if (n.force === "S") return "strum";
  return naturalHopo(i, notes) ? "hopo" : "strum";
}
function naturalHopo(i, notes = S.notes) {
  const n = notes[i], p = notes[i - 1];
  if (!p || n.lanes.length !== 1 || n.tick - p.tick > S.chart.hopo_threshold) return false;
  return p.lanes.length > 1 || p.lanes[0] !== n.lanes[0];
}

// ------------------------------------------------------------------ undo
function snapshot() { S.undo.push(S.notes.map(clone)); S.redo = []; if (S.undo.length > 300) S.undo.shift(); }
function undo() { if (!S.undo.length) return; S.redo.push(S.notes.map(clone)); S.notes = S.undo.pop(); renderAll(); }
function redo() { if (!S.redo.length) return; S.undo.push(S.notes.map(clone)); S.notes = S.redo.pop(); renderAll(); }

// ------------------------------------------------------------------ open a song
async function openSong(path, inst) {
  stopAudio(); buffers = {}; loop = null; pos = 0;
  S.path = path; renderSongs();
  history.replaceState(null, "", `?song=${encodeURIComponent(path)}${inst ? `&inst=${inst}` : ""}`);
  $("#main").innerHTML = `<div class="empty">Reading the chart…</div>`;
  try { S.chart = await getJSON(`/api/doctor/chart?song=${encodeURIComponent(path)}`); }
  catch (e) { $("#main").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; return; }
  const insts = Object.keys(S.chart.instruments);
  if (!insts.length) { $("#main").innerHTML = `<div class="empty">This chart has no guitar or bass notes.</div>`; return; }
  buildTiming();
  openInstrument(insts.includes(inst) ? inst : insts[0]);
}

function openInstrument(inst, keep = null) {
  if (!keep) { stopAudio(); loop = null; buffers = {}; }  // the band mix is everything but this instrument's stem
  S.inst = inst;
  const d = S.chart.instruments[inst];
  S.orig = d.difficulties[3].map(noteOf);
  S.origByTick = new Map(S.orig.map(n => [n.tick, n]));
  S.notes = S.orig.map(clone);
  S.undo = []; S.redo = []; S.picked = new Set(); S.hover = null; S.drag = null; S.pcache = new Map();
  S.hardCopy = sameNotes(d.difficulties[2], d.difficulties[3]);
  S.rebuild = keep ? false : S.hardCopy;
  S.snap = S.snap ?? true; S.grid = S.grid ?? "auto";
  S.riffs = findRiffs();
  if (keep) {
    S.sel = Math.min(keep.sel, S.riffs.length - 1); S.view = keep.view;
    if (S.pitch) S.riffs.forEach(analyseRiff);
  } else {
    S.pitch = null; S.pitchState = d.stem ? "loading" : "nostem"; S.sel = S.riffs.length ? 0 : -1;
    const first = S.notes.length ? S.notes[0].t : 0;
    S.view = { t0: Math.max(0, (S.riffs[0] ? S.barSec[S.riffs[0].starts[0]] : first) - 1), span: 14 };
  }
  history.replaceState(null, "", `?song=${encodeURIComponent(S.path)}&inst=${inst}`);
  renderPage();
  if (!keep && d.stem) { loadPitch(); loadAudio(d.stem, "_stem"); }
}

// ------------------------------------------------------------------ riffs
// A riff is a run of 1, 2 or 4 bars whose chart notes repeat exactly (same rhythm, same frets)
// at least three times, found in the chart as opened. Its repeats are bar ranges, so edits to
// one repeat (adding, removing, re-fretting) can be made at the same spot in every other.
function findRiffs() {
  const notes = S.orig, bars = S.bars, nb = bars.length - 1, first = [];
  for (let b = 0, j = 0; b <= nb; b++) { while (j < notes.length && notes[j].tick < bars[b]) j++; first.push(j); }
  const used = new Uint8Array(nb), riffs = [];
  const sig = (b, L) => {
    const a = first[b], z = first[b + L];
    if (z - a < 3) return null;
    let s = `${bars[b + L] - bars[b]}|`;
    for (let k = a; k < z; k++) s += `${notes[k].tick - bars[b]}:${notes[k].lanes.join("")},`;
    return s;
  };
  for (let round = 0; round < 12; round++) {
    let best = null;
    for (const L of [1, 2, 4]) {
      const found = new Map();
      for (let b = 0; b + L <= nb; b++) {
        let free = true;
        for (let k = b; k < b + L; k++) if (used[k]) { free = false; break; }
        const s = free && sig(b, L);
        if (s) (found.get(s) || found.set(s, []).get(s)).push(b);
      }
      for (const starts of found.values()) {
        const chosen = []; let last = -1;
        for (const b of starts) if (b >= last) { chosen.push(b); last = b + L; }
        if (chosen.length < 3) continue;
        const score = chosen.length * (first[chosen[0] + L] - first[chosen[0]]);
        if (!best || score > best.score) best = { L, starts: chosen, score };
      }
    }
    if (!best || best.score < 16) break;

// ------------------------------------------------------------------ diagnosis

                frets: counts.filter(Boolean).length, same: 0, sameMoved: 0 };

// ------------------------------------------------------------------ pitch
async function loadPitch() {
  const path = S.path, inst = S.inst;
  const q = `song=${encodeURIComponent(path)}&instrument=${inst}`;
  try {
    let p = await getJSON(`/api/doctor/pitch?${q}`);
    if (p.missing) {
      const { job } = await post("pitch", { song: path, instrument: inst });
      let st;
      do { await new Promise(r => setTimeout(r, 1000)); st = await getJSON(`/api/job/${job}`); }
      while (st.status === "queued" || st.status === "running");
      if (st.status === "error") throw new Error(st.error);
      p = await getJSON(`/api/doctor/pitch?${q}`);
    }
    if (S.path !== path || S.inst !== inst) return;
    S.pitch = p; S.pcache = new Map(); S.pitchState = "ok";
    const v = []; for (let i = 0; i < p.midi.length; i++) if (p.conf[i] >= VOICED && p.level[i] >= LOUD && p.midi[i] > 0) v.push(p.midi[i]);
    v.sort((a, b) => a - b);
    let lo = Math.floor(v[Math.floor(v.length * 0.02)] || 40) - 2, hi = Math.ceil(v[Math.floor(v.length * 0.98)] || 76) + 2;
    if (hi - lo < 14) { const mid = (hi + lo) / 2; lo = Math.floor(mid - 7); hi = Math.ceil(mid + 7); }
    S.range = [lo, hi];
    S.riffs.forEach(analyseRiff);
    renderAll();
  } catch (e) {
    if (S.path === path) { S.pitchState = { error: `Couldn't listen to the stem: ${e.message}` }; renderDiagnosis(); }
  }
}

  const step = gridStep();
  for (let k = geo.a; k <= geo.z + 0.5; k += step) {
    const onBar = r.L > 0 && S.bars.slice(b0, b0 + r.L + 1).includes(Math.round(k));
    const onBeat = Math.abs(((k - geo.a) / bl) - Math.round((k - geo.a) / bl)) < 1e-6;
    g.fillStyle = css(onBar ? "--bar" : onBeat ? "--beat" : "--grid"); g.fillRect(geo.X(k), geo.top - 4, onBar ? 2 : 1, bottom - geo.top + 4);
  }
  g.textAlign = "center"; g.textBaseline = "middle";
  // the stem's guess at each step of the riff as charted
  if (r.slots) r.rels.forEach((rel, j) => {
    const s = r.slots[j], x = geo.X(geo.a + rel);
    g.font = "600 11px system-ui"; g.fillStyle = s.pitch ? css("--text") : css("--muted");
    g.fillText(s.pitch ? NAMES[s.pitch.pc] : "?", x, 10);
    g.font = "10px system-ui"; g.fillStyle = css("--muted");
    if (s.pitch) g.fillText(pct(s.pitch.agree), x, 23);
  });
  const now = notesIn(geo.a, geo.z);
  now.forEach((n, j) => {
    const x = geo.X(n.tick), i = findIdx(n.tick);
    for (const l of n.lanes) drawGem(g, x - GEM_W / 2, y(l), l, hopoKind(i), 12);
    g.font = "10px system-ui"; g.fillStyle = css("--muted");
    g.fillText(String(j + 1), x, bottom + 9);
  });
  for (const o of S.orig.filter(o => o.tick >= geo.a && o.tick < geo.z)) {
    const n = noteAt(o.tick);
    if (n && n.lanes.join() === o.lanes.join()) continue;
    g.setLineDash([3, 2]); g.lineWidth = 1.5;
    for (const l of o.lanes) { g.strokeStyle = COLOR[l]; g.beginPath(); g.arc(geo.X(o.tick), y(l), 7, 0, 7); g.stroke(); }
    g.setLineDash([]);
  }
  g.textAlign = "left";
}

// ------------------------------------------------------------------ timeline interaction
function setupTimeline() {
  const cv = $("#timeline"), ov = $("#overview");
  cv.addEventListener("wheel", e => {
    const v = S.view, rect = cv.getBoundingClientRect(), at = v.t0 + (e.clientX - rect.left) / rect.width * v.span;
    const sideways = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);
    if (!(e.ctrlKey || e.metaKey) && !sideways) return;  // a plain wheel scrolls the page
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) zoom(Math.exp(e.deltaY * 0.0015), at);
    else { v.t0 = Math.max(0, Math.min(S.chart.duration - v.span / 2, v.t0 + (e.shiftKey ? e.deltaY || e.deltaX : e.deltaX) / rect.width * v.span * 0.6)); draw(); }
  }, { passive: false });
  const at = e => {  // pointer -> time, lane (null above the lanes), the note in reach
    const rect = cv.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top, v = S.view;
    const row = Math.floor((y - laneTop()) / GEO.lane), lane = row >= 0 && row < ROWS.length ? ROWS[row] : null;
    const X = tt => (tt - v.t0) / v.span * rect.width;
    let note = null, bd = 9;
    if (lane !== null) for (const n of S.notes) {
      if (n.t < v.t0 - 1) continue; if (n.t > v.t0 + v.span + 1) break;
      const d = Math.abs(X(n.t) + GEM_W / 2 - x); if (d < bd) { bd = d; note = n.tick; }
    }
    const sec = v.t0 + x / rect.width * v.span;
    return { x, sec, tick: tickAt(sec), lane, note, onGem: note !== null && noteAt(note).lanes.includes(lane) };
  };
  let down = null;
  cv.addEventListener("mousedown", e => { if (e.button === 0) { down = { ...at(e), shift: e.shiftKey, ctrl: e.ctrlKey || e.metaKey }; e.preventDefault(); } });
  cv.addEventListener("mousemove", e => {
    if (down) return;
    const h = at(e);
    cv.style.cursor = h.note !== null ? (h.onGem ? "pointer" : "copy") : h.lane !== null ? "cell" : "text";
    const ghost = h.note === null && h.lane !== null ? { tick: snapTick(h.tick), lane: h.lane } : null;
    if (h.note !== S.hover || JSON.stringify(ghost) !== JSON.stringify(S.ghostAdd)) { S.hover = h.note; S.ghostAdd = ghost; draw(); }
  });
  cv.addEventListener("mouseleave", () => { if (S.hover != null || S.ghostAdd) { S.hover = null; S.ghostAdd = null; draw(); } });
  cv.addEventListener("contextmenu", e => {
    const h = at(e);
    if (h.note === null) return;
    e.preventDefault();
    snapshot(); deleteNotes(repeatsOf(h.note)); S.hover = null; renderAll();
  });
  S.onMove = e => {
    if (!down) return;
    const h = at(e);
    if (!S.drag) {
      if (Math.abs(h.x - down.x) < 5) return;
      // dragging from a note sets its sustain; from anywhere else, selects
      S.drag = down.onGem ? { mode: "sustain", tick: down.note } : { mode: "select", a: down.sec, b: h.sec };
      if (S.drag.mode === "sustain") snapshot();
    }
    if (S.drag.mode === "select") S.drag.b = h.sec;
    else {
      const end = snapTick(h.tick), len = end - S.drag.tick;
      setLength(S.drag.tick, len > S.chart.sustain_cutoff ? len : noSustain());
    }
    draw();
  };
  S.onUp = () => {
    if (!down) return;
    const start = down; down = null;
    if (S.drag) {
      const d = S.drag; S.drag = null;
      if (d.mode === "select") {
        const a = Math.min(d.a, d.b), b = Math.max(d.a, d.b);
        if (!start.shift) S.picked.clear();
        S.notes.forEach(n => { if (n.t >= a && n.t <= b) S.picked.add(n.tick); });
        renderSelBar(); draw();
      } else renderAll();
      return;
    }
    if (start.lane === null) {                       // above the lanes: seek
      if (S.picked.size && !start.shift) { S.picked.clear(); renderSelBar(); }
      seek(start.sec); return;
    }
    if (start.note !== null && start.onGem && !start.shift) {   // a note itself: select it
      if (start.ctrl) { S.picked.has(start.note) ? S.picked.delete(start.note) : S.picked.add(start.note); }
      else S.picked = new Set([start.note]);
      renderSelBar(); draw(); return;
    }
    snapshot();
    if (start.note !== null) editLane(start.note, start.lane, start.shift);   // its column, another lane
    else addNote(snapTick(start.tick), start.lane);                           // an empty spot
    S.ghostAdd = null;
    renderAll();
  };
  let dragging = false;
  const ovMove = e => {
    const rect = ov.getBoundingClientRect();
    S.view.t0 = Math.max(0, (e.clientX - rect.left) / rect.width * S.chart.duration - S.view.span / 2); draw();
  };
  ov.addEventListener("mousedown", e => { dragging = true; ovMove(e); });
  S.onOverview = e => dragging && ovMove(e);
  S.onOverviewUp = () => dragging = false;
}
// Window-wide pointer handlers, added once; the timeline (rebuilt with the page) sets what they call.
addEventListener("mousemove", e => { S.onMove && S.onMove(e); S.onOverview && S.onOverview(e); });
addEventListener("mouseup", e => { S.onUp && S.onUp(e); S.onOverviewUp && S.onOverviewUp(e); });
addEventListener("keydown", e => {
  if (!S.chart || !S.notes || (e.target.matches && e.target.matches("input[type=text], textarea, select"))) return;
  const k = e.key, ctrl = e.ctrlKey || e.metaKey;
  if (e.code === "Space") { e.preventDefault(); playing ? pauseAudio() : playAudio(pos); }
  else if (ctrl && (k === "z" || k === "Z")) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (ctrl && (k === "y" || k === "Y")) { e.preventDefault(); redo(); }
  else if (ctrl && k === "a") { e.preventDefault(); S.notes.forEach(n => S.picked.add(n.tick)); renderSelBar(); draw(); }
  else if (k === "Escape" && S.picked.size) { S.picked.clear(); renderSelBar(); draw(); }
  else if ((k === "ArrowUp" || k === "ArrowDown") && S.picked.size) { e.preventDefault(); shiftPicked(k === "ArrowUp" ? -1 : 1); }
  else if ((k === "ArrowLeft" || k === "ArrowRight") && S.picked.size) { e.preventDefault(); nudgePicked(k === "ArrowLeft" ? -1 : 1); }
  else if (k === "ArrowRight") { S.view.t0 += S.view.span * 0.25; draw(); }
  else if (k === "ArrowLeft") { S.view.t0 = Math.max(0, S.view.t0 - S.view.span * 0.25); draw(); }
  else if (k === "Delete" || k === "Backspace") {
    const ts = targets(); if (!ts.length) return;
    e.preventDefault(); snapshot(); deleteNotes(ts); S.hover = null; renderAll();
  }
  else if (k === "h" || k === "H") {
    const ts = targets(); if (!ts.length) return;
    const anyStrum = ts.some(t => hopoKind(findIdx(t)) === "strum");
    snapshot(); setHopo(ts, anyStrum ? "hopo" : "strum"); renderAll();
  }
  else if (k === "s" || k === "S") { S.snap = !S.snap; const c = $("#snap"); if (c) c.checked = S.snap; draw(); }
  else if (k === "+" || k === "=") zoom(1 / 1.5);
  else if (k === "-" || k === "_") zoom(1.5);
});
addEventListener("resize", () => { if (S.chart) { draw(); drawTemplate(); } });

// ------------------------------------------------------------------ start
(() => {
  loadSettings();
  const root = store.get("doctor-root");
  if (root) { $("#root").value = root; listSongs(); }
  const q = new URLSearchParams(location.search);
  if (q.get("song")) openSong(q.get("song"), q.get("inst"));
})();
</script>
